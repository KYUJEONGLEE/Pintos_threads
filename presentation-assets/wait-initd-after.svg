<svg width="620" height="349" viewBox="0 0 620 349" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="620" height="349" rx="7" fill="#F8F8FB"/>
  <rect y="322" width="620" height="27" fill="#000319"/>
  <circle cx="25" cy="335.5" r="5.5" fill="#F8F8FB"/>
  <path d="M39 329L45 342H33L39 329Z" fill="#F8F8FB"/>
  <rect x="49" y="331" width="9" height="9" rx="1" fill="#F8F8FB"/>
  <text x="551" y="339" fill="#F8F8FB" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="9" font-weight="700">1조 한양열</text>

  <text x="36" y="43" fill="#080B1F" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="24" font-weight="900">수정 후 해결한 구조</text>
  <text x="36" y="66" fill="#5A6072" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="600">process_create_initd()에서도 wait에 필요한 자식 정보를 등록했습니다.</text>

  <rect x="36" y="91" width="548" height="196" rx="10" fill="#FFFFFF" stroke="#E6E8EF"/>
  <rect x="36" y="91" width="548" height="44" rx="10" fill="#078B45"/>
  <text x="58" y="119" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="900">해결: initd도 일반 자식처럼 child_status 등록</text>

  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif">
    <rect x="57" y="160" width="122" height="76" rx="8" fill="#F0FFF6" stroke="#078B45"/>
    <text x="82" y="185" fill="#111" font-size="14" font-weight="900">initd 생성</text>
    <text x="75" y="207" fill="#078B45" font-size="12" font-weight="800">thread_create()</text>

    <path d="M179 198H207" stroke="#121212" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="216" y="160" width="132" height="76" rx="8" fill="#F0FFF6" stroke="#078B45"/>
    <text x="239" y="185" fill="#111" font-size="14" font-weight="900">child_status</text>
    <text x="238" y="207" fill="#078B45" font-size="12" font-weight="800">exit_sema 초기화</text>

    <path d="M348 198H376" stroke="#121212" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="385" y="150" width="146" height="96" rx="8" fill="#FAFAFA" stroke="#111" stroke-dasharray="6 5"/>
    <text x="416" y="173" fill="#111" font-size="13" font-weight="900">children list</text>
    <rect x="421" y="187" width="74" height="40" rx="5" fill="#D9F5E5" stroke="#111"/>
    <text x="432" y="212" fill="#111" font-size="13" font-weight="900">initd_tid</text>
  </g>

  <rect x="62" y="252" width="488" height="24" rx="5" fill="#E9F8F0"/>
  <text x="81" y="268" fill="#111" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="900">결과: process_wait(initd_tid)가 자식을 찾고 sema_down으로 정상 대기</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#121212"/>
