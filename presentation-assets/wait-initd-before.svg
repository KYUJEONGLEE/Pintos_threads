<svg width="620" height="349" viewBox="0 0 620 349" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="620" height="349" rx="7" fill="#F8F8FB"/>
  <rect y="322" width="620" height="27" fill="#000319"/>
  <circle cx="25" cy="335.5" r="5.5" fill="#F8F8FB"/>
  <path d="M39 329L45 342H33L39 329Z" fill="#F8F8FB"/>
  <rect x="49" y="331" width="9" height="9" rx="1" fill="#F8F8FB"/>
  <text x="551" y="339" fill="#F8F8FB" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="9" font-weight="700">1조 한양열</text>

  <text x="36" y="43" fill="#080B1F" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="24" font-weight="900">초기 구현에서 놓친 점</text>
  <text x="36" y="66" fill="#5A6072" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="600">fork 경로만 생각해서 initd 생성 경로의 자식 등록이 빠졌습니다.</text>

  <rect x="36" y="91" width="548" height="196" rx="10" fill="#FFFFFF" stroke="#E6E8EF"/>
  <rect x="36" y="91" width="548" height="44" rx="10" fill="#EF321A"/>
  <text x="58" y="119" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="900">문제: initd는 생성됐지만 children list에는 없었다</text>

  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif">
    <rect x="62" y="163" width="142" height="70" rx="8" fill="#FFF4F0" stroke="#EF321A"/>
    <text x="91" y="190" fill="#111" font-size="15" font-weight="900">process_fork()</text>
    <text x="84" y="211" fill="#EF321A" font-size="12" font-weight="800">child_status 등록 O</text>

    <rect x="240" y="163" width="142" height="70" rx="8" fill="#FFF4F0" stroke="#EF321A"/>
    <text x="259" y="190" fill="#111" font-size="15" font-weight="900">create_initd()</text>
    <text x="263" y="211" fill="#EF321A" font-size="12" font-weight="800">child_status 등록 X</text>

    <path d="M204 198H232" stroke="#121212" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M382 198H414" stroke="#121212" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="424" y="153" width="126" height="90" rx="8" fill="#FAFAFA" stroke="#111" stroke-dasharray="6 5"/>
    <text x="445" y="176" fill="#111" font-size="13" font-weight="900">children list</text>
    <rect x="456" y="190" width="62" height="32" rx="4" fill="#FFF" stroke="#111"/>
    <line x1="456" y1="206" x2="518" y2="206" stroke="#999"/>
    <text x="461" y="237" fill="#EF321A" font-size="12" font-weight="900">initd 없음</text>
  </g>

  <rect x="62" y="252" width="488" height="24" rx="5" fill="#FFF0EA"/>
  <text x="79" y="268" fill="#111" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="900">결과: process_wait(initd_tid)가 자식으로 못 찾아 -1을 반환하고 테스트가 바로 실패</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#121212"/>
    </marker>
  </defs>
</svg>
